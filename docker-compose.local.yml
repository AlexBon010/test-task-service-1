version: '3.8'

services:
    mongodb:
        image: mongo:latest
        container_name: mongodb
        restart: unless-stopped
        ports:
            - '${MONGODB_PORT_EXTERNAL}:${MONGODB_PORT_INTERNAL}'
        volumes:
            - mongodb_data:/data/db

    redis-timeseries:
        image: redislabs/redistimeseries:latest
        container_name: redis-timeseries
        restart: unless-stopped
        ports:
            - '${REDIS_PORT_EXTERNAL}:${REDIS_PORT_INTERNAL}'
        volumes:
            - redis_data:/data
        command: ['redis-server', '--requirepass', '${REDIS_PASSWORD}']

    kafka:
        image: apache/kafka:latest
        container_name: kafka
        restart: unless-stopped
        ports:
            - '9092:9092'
            - '9093:9093'
        environment:
            KAFKA_NODE_ID: 1
            KAFKA_PROCESS_ROLES: broker,controller
            KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: 'true'
            KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
            KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,CONTROLLER://localhost:9093
            KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
            KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
            KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
            KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
            KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
            KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
            KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
            KAFKA_NUM_PARTITIONS: 3
            KAFKA_REST_ACCESS_CONTROL_ALLOW_ORIGIN: '*'
            KAFKA_REST_ACCESS_CONTROL_ALLOW_METHODS: 'GET,POST,PUT,DELETE'
            KAFKA_REST_ACCESS_CONTROL_ALLOW_HEADERS: 'origin,content-type,accept,authorization'
        volumes:
            - kafka_data:/var/lib/kafka/data
    elasticsearch:
        image: elasticsearch:9.1.0
        container_name: elasticsearch
        restart: unless-stopped
        volumes:
            - elasticsearch_data:/usr/share/elasticsearch/data
        environment:
            discovery.type: single-node
            xpack.security.enabled: false
        ports:
            - '9200:9200'

volumes:
    mongodb_data:
    redis_data:
    kafka_data:
    elasticsearch_data:
